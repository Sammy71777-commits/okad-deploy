<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B1F3A">
<title>Offline — OKAD AFRICA</title>
<style>
  :root { --navy:#0B1F3A; --orange:#FF6B2C; --soft:#F7F8FA; --mid:#6B7280; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif;
    background: var(--navy);
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .box {
    text-align: center;
    max-width: 400px;
  }
  .icon {
    width: 96px; height: 96px;
    background: var(--orange);
    border-radius: 20px;
    margin: 0 auto 24px;
    display: flex; align-items: center; justify-content: center;
    font-size: 48px; font-weight: 900;
  }
  h1 { font-size: 24px; font-weight: 800; margin-bottom: 12px; }
  p { font-size: 15px; line-height: 1.5; color: rgba(255,255,255,.7); margin-bottom: 24px; }
  button {
    background: var(--orange);
    color: white;
    border: none;
    padding: 12px 28px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { opacity: 0.9; }
  .tips {
    margin-top: 28px;
    padding: 16px;
    background: rgba(255,255,255,.08);
    border-radius: 12px;
    font-size: 13px;
    color: rgba(255,255,255,.6);
    text-align: left;
  }
  .tips b { color: rgba(255,255,255,.85); }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">O</div>
    <h1>You're offline</h1>
    <p>No internet connection right now. Check your network and try again.</p>
    <button onclick="location.reload()">Retry</button>
    <div class="tips">
      <b>Tips:</b><br>
      • Previously viewed pages may still be available<br>
      • Tracking & orders are saved locally<br>
      • We'll auto-sync when you're back online
    </div>
  </div>
</body>
</html>
